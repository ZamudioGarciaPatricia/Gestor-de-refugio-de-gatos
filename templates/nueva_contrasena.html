{% extends "base.html" %}

{% block title %} Nueva Contraseña {% endblock %}

{% block content %}
<div class="container p-5 my-5 bg-secondary bg-opacity-25 rounded border border-dark border-opacity-50 text-center" style="max-width: 600px;">
    
    <h1 class="display-4 fw-bold mb-3">Nueva contraseña</h1>
    
    <p class="text-dark opacity-75 display-6 fs-6 mb-5">Escribe la nueva contraseña que usarás para acceder a tu cuenta.</p>

    <form action="{{ url_for('restablecer_con_token', token=token) }}" method="POST" class="text-start">
        
        <div class="mb-5">
            <label class="form-label display-6 fs-5 fw-semibold">Nueva Contraseña</label>
            <input type="password" name="nuevo_secreto" class="form-control rounded display-6 fs-6" minlength="8" required>
            <div class="form-text text-dark opacity-75 display-6 fs-6">La contraseña necesita al menos 8 caracteres.</div>
        </div>
        
        <button type="submit" class="btn btn-dark w-100 p-3 rounded fw-bold display-6 fs-5">Actualizar contraseña</button>
    </form>

</div>
{% endblock %}
